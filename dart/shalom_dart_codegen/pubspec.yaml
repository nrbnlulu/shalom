name: shalom_dart_codegen
description: Dart CLI wrapper for the Shalom GraphQL code generator.
version: 0.1.0 # x-release-please-version
repository: https://github.com/nrbnlulu/shalom

environment:
  sdk: ">=3.10.0 <4.0.0"

executables:
  shalom: shalom

dependencies:
  hooks: ^2.0.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.24.0

# Avoid downloading an unpublished release while testing this package itself.
# Package-level user defines are ignored when this package is a dependency.
hooks:
  user_defines:
    shalom_dart_codegen:
      skip_download: true
