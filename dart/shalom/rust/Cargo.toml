[package]
name = "shalom_ffi"
version = "0.1.0"
edition = "2024"

[lib]
name = "shalom_ffi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = { git = "https://github.com/shri-acha/flutter_rust_bridge", rev = "d1c1957a045825434c86ef6bc936c3299431c5fb" }
shalom_runtime = "0.1.8"
shalom_core = "0.1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros"] }
tokio-stream = "0.1.17"
anyhow = "1.0"
log = "0.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
