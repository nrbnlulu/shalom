[package]
name = "shalom_core"
version = "0.1.4"
edition = "2024"
description = "GraphQL parsing, validation and core types for the Shalom GraphQL client."
license = "MIT"
repository = "https://github.com/nrbnlulu/shalom"

[lib]
name = "shalom_core"

[dependencies]
anyhow = {workspace = true}
apollo-compiler = {workspace = true}
simple_logger = {workspace = true}
log = {workspace = true}
glob = {workspace = true}
kash = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
indexmap = { version = "2", features = ["serde"] }
serde_yaml = "0.9"
parking_lot = { workspace = true }

# `apollo-compiler` and `kash` need randomness, which browsers provide through
# JavaScript.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }
