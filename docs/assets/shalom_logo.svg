<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="iconBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1A2234"/>
      <stop offset="100%" stop-color="#0A0E17"/>
    </radialGradient>
    <linearGradient id="flutterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="rustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="100" fill="url(#iconBg)"/>
  <rect width="508" height="508" x="2" y="2" rx="98" fill="none" stroke="#334155" stroke-width="2" opacity="0.6"/>

  <g transform="translate(68, 60) scale(1.35)">
    <!-- Dart / Flutter Wings -->
    <polygon points="175,50 260,20 205,90" fill="url(#flutterGrad)" opacity="0.95"/>
    <polygon points="205,90 285,65 190,130" fill="#0284C7" opacity="0.8"/>
    <polygon points="190,130 255,115 160,160" fill="#0369A1" opacity="0.7"/>

    <!-- Rust Tail & Propulsion -->
    <polygon points="110,175 160,160 145,220" fill="url(#rustGrad)" opacity="0.95"/>
    <polygon points="90,220 145,220 115,270" fill="#C2410C" opacity="0.85"/>
    <polygon points="70,260 115,270 85,300" fill="#9A3412" opacity="0.75"/>

    <!-- Dove Head -->
    <polygon points="175,50 205,90 135,105" fill="#38BDF8"/>
    <polygon points="135,105 105,85 110,125" fill="#7DD3FC"/>
    <polygon points="105,85 80,95 100,105" fill="#FB923C"/>

    <!-- GraphQL Mesh Network -->
    <g stroke="#E10098" stroke-width="3" fill="none">
      <line x1="135" y1="105" x2="175" y2="145"/>
      <line x1="175" y1="145" x2="145" y2="200"/>
      <line x1="145" y1="200" x2="105" y2="165"/>
      <line x1="105" y1="165" x2="135" y2="105"/>
      <line x1="135" y1="105" x2="145" y2="200"/>
      <line x1="105" y1="165" x2="175" y2="145"/>
      <line x1="175" y1="145" x2="215" y2="160" stroke="#F43F5E" stroke-dasharray="3,3"/>
      <line x1="145" y1="200" x2="170" y2="240" stroke="#EA580C" stroke-width="2.5"/>
    </g>

    <!-- Rust Cog Accent -->
    <circle cx="170" cy="240" r="14" fill="none" stroke="#F97316" stroke-width="3.5" stroke-dasharray="6,3"/>
    <circle cx="170" cy="240" r="5" fill="#F97316"/>

    <!-- GraphQL Nodes -->
    <circle cx="135" cy="105" r="6" fill="#FFFFFF" stroke="#E10098" stroke-width="3" filter="url(#glow)"/>
    <circle cx="175" cy="145" r="7" fill="#F43F5E" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="145" cy="200" r="6" fill="#E10098" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="105" cy="165" r="5" fill="#FFFFFF" stroke="#E10098" stroke-width="2"/>
    <circle cx="215" cy="160" r="4.5" fill="#38BDF8"/>
  </g>
</svg>
