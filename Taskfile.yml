# https://taskfile.dev

version: "3"

vars:
    GREETING: Hello, World!
    TEST_THREADS: '{{default "2" .SHALOM_TEST_THREADS}}'
    DART_BIN:
        sh: |
            if command -v fvm > /dev/null 2>&1; then
              echo "fvm dart"
            else
              echo "dart"
            fi
    FLUTTER_BIN:
        sh: |
            if command -v fvm > /dev/null 2>&1; then
              echo "fvm flutter"
            else
              echo "flutter"
            fi

tasks:
    default:
        cmds:
            - echo "{{.GREETING}}"
        silent: true

    generate_rust_bindings:
        cmds:
            - cd dart/shalom && flutter_rust_bridge_codegen generate

    fmt:
        cmds:
            - cargo fmt --all
            - cd rust/shalom_dart_codegen/dart_tests && {{.DART_BIN}} format ./test ./lib
            - "{{.DART_BIN}} format ./dart"

    fix:
        cmds:
            - cd rust && cargo fmt
            - cd rust && cargo clippy --fix --allow-dirty

    lint:
        cmds:
            - cd rust && cargo fmt --all --check
            - cd rust && cargo clippy -- -D warnings
            - cd rust/shalom_dart_codegen/dart_tests && find . -type f -name "*.dart" -not -path "*/__graphql__/*" | xargs {{.DART_BIN}} format --set-exit-if-changed
            - cd rust/shalom_dart_codegen/dart_tests && {{.DART_BIN}} analyze ./test ./lib
            - cd dart/shalom && {{.DART_BIN}} analyze ./test ./lib
            - cd dart/shalom_dart_codegen && {{.DART_BIN}} analyze
            - typos

    test:
        cmds:
            - cd rust && cargo test -- --test-threads={{.TEST_THREADS}}
            - cd dart/shalom && {{.DART_BIN}} test
            - cd dart/shalom_dart_codegen && {{.DART_BIN}} test

    publish_dart_packages:
        desc: Publish Dart package versions that are not on pub.dev yet
        preconditions:
            - sh: command -v curl
              msg: curl is required to query pub.dev
        cmds:
            - |
                set -eu

                for package_dir in \
                    dart/shalom_annotations \
                    dart/shalom \
                    dart/shalom_dart_codegen \
                    dart/shalom_flutter
                do
                    package_name="$(sed -n 's/^name:[[:space:]]*//p' "$package_dir/pubspec.yaml" | head -n 1)"
                    local_version="$(sed -n 's/^version:[[:space:]]*//p' "$package_dir/pubspec.yaml" | head -n 1)"
                    status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://pub.dev/api/packages/$package_name/versions/$local_version")"

                    case "$status" in
                        200) echo "$package_name $local_version is already published" ;;
                        404)
                            echo "Publishing $package_name $local_version"
                            (cd "$package_dir" && {{.DART_BIN}} pub publish --force)
                            ;;
                        *) echo "Could not check $package_name $local_version on pub.dev (HTTP $status)" >&2; exit 1 ;;
                    esac
                done
