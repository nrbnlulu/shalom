name: Benchmarks

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

# Public-repository uploads are tokenless, including fork PRs.
permissions:
    contents: read

jobs:
    benchmarks:
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        env:
            CARGO_BUILD_JOBS: 2

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Rust and cargo-codspeed
              uses: moonrepo/setup-rust@v1
              with:
                  channel: stable
                  cache-target: release
                  bins: cargo-codspeed@6.0.0

            - name: Build benchmarks
              run: cargo codspeed build --locked -p shalom_runtime --bench runtime_bench --measurement-mode simulation,memory

            - name: Run benchmarks and upload to CodSpeed
              uses: CodSpeedHQ/action@v5
              with:
                  mode: simulation,memory
                  run: cargo codspeed run
