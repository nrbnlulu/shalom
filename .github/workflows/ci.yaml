name: CI/CD Pipeline

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    benchmarks:
        runs-on: ubuntu-latest
        env:
            CARGO_BUILD_JOBS: 2

        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Set up Rust
              uses: actions-rust-lang/setup-rust-toolchain@v1
              with:
                  toolchain: stable

            - name: Run cache performance regression tests
              run: cargo test -p shalom_runtime --release --test perf -- --ignored --nocapture --test-threads=1

    build-and-test:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Rust
              uses: dtolnay/rust-toolchain@v1
              with:
                  toolchain: stable
                  override: true
                  components: rustfmt, clippy

            - name: Setup Flutter SDK
              uses: flutter-actions/setup-flutter@v4
              with:
                  channel: stable

            - name: Install Task
              uses: arduino/setup-task@v2
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Install dart test packages
              run: |
                  cd rust/shalom_dart_codegen/dart_tests/
                  dart pub get

            - name: Install flutter test packages
              run: |
                  cd rust/shalom_dart_codegen/flutter_tests/
                  flutter pub get

            - name: Test
              env:
                  SHALOM_TEST_THREADS: ${{ runner.os == 'Windows' && '1' || '2' }}
              run: |
                  task test

            - name: Install typos
              if: runner.os == 'Linux'
              run: |
                  cargo install typos-cli

            - name: Lint
              if: runner.os == 'Linux'
              run: task lint

    gif-search-example:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Rust
              uses: dtolnay/rust-toolchain@v1
              with:
                  toolchain: 1.89.0
                  override: true

            - name: Setup Flutter SDK
              uses: flutter-actions/setup-flutter@v4
              with:
                  channel: stable

            - name: Build shalom_ffi
              run: cargo build -p shalom_ffi

            - name: Install GIF search dependencies
              run: |
                  cd examples/flutter/gif_search
                  flutter pub get

            - name: Test GIF search example
              run: |
                  cd examples/flutter/gif_search
                  flutter test
