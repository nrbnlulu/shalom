name: CI/CD Pipeline

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    build-and-test:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Set up Rust
              uses: actions-rust-lang/setup-rust-toolchain@v1
              with:
                  toolchain: stable
                  override: true
                  components: rustfmt, clippy

            - name: Setup Flutter SDK
              uses: flutter-actions/setup-flutter@v4
              with:
                  channel: stable

            - name: Install Task
              uses: arduino/setup-task@v2
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Install flutter packages
              run: |
                  cd rust/shalom_dart_codegen/dart_tests/
                  flutter packages get

            - name: Install flutter test packages
              run: |
                  cd rust/shalom_dart_codegen/flutter_tests/
                  flutter packages get

            - name: Test
              env:
                  SHALOM_TEST_THREADS: ${{ runner.os == 'Windows' && '1' || '2' }}
              run: |
                  task test

            - name: Install typos
              if: runner.os == 'Linux'
              run: |
                  cargo install typos-cli

            - name: Lint
              if: runner.os == 'Linux'
              run: task lint

    build-codegen-binaries:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: build-and-test
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: ubuntu-latest
                      binary: target/release/shalom
                      asset: shalom-linux-x64
                    - runner: ubuntu-24.04-arm
                      binary: target/release/shalom
                      asset: shalom-linux-arm64
                    - runner: macos-15-intel
                      binary: target/release/shalom
                      asset: shalom-macos-x64
                    - runner: macos-15
                      binary: target/release/shalom
                      asset: shalom-macos-arm64
                    - runner: windows-latest
                      binary: target/release/shalom.exe
                      asset: shalom-windows-x64.exe
                    - runner: windows-11-arm
                      binary: target/release/shalom.exe
                      asset: shalom-windows-arm64.exe
        runs-on: ${{ matrix.runner }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Rust
              uses: actions-rust-lang/setup-rust-toolchain@v1
              with:
                  toolchain: stable

            - name: Build codegen binary
              run: cargo build --release --package shalom_dart_codegen

            - name: Name release asset
              shell: bash
              run: cp "${{ matrix.binary }}" "${{ matrix.asset }}"

            - name: Upload codegen binary
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.asset }}
                  path: ${{ matrix.asset }}
                  if-no-files-found: error
                  retention-days: 1

    release:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: build-codegen-binaries
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: write
            pull-requests: write
        steps:
            - name: Create release PR or GitHub release
              id: release
              uses: googleapis/release-please-action@v4

            - name: Download codegen binaries
              if: steps.release.outputs.release_created == 'true'
              uses: actions/download-artifact@v4
              with:
                  pattern: shalom-*
                  path: release-assets
                  merge-multiple: true

            - name: Attach codegen binaries to GitHub release
              if: steps.release.outputs.release_created == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release upload "${{ steps.release.outputs.tag_name }}" release-assets/* --clobber
