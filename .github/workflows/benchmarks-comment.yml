name: Benchmarks comment

# Posts the benchmark report produced by the "Benchmarks" workflow on the PR.
# Runs in the base repo context (write token) so it also works for fork PRs.
# SECURITY: never check out or execute PR code here; the artifact is treated as data only.

on:
    workflow_run:
        workflows: ["Benchmarks"]
        types: [completed]

permissions:
    actions: read
    pull-requests: write

jobs:
    comment:
        if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
        runs-on: ubuntu-latest
        env:
            GH_TOKEN: ${{ github.token }}
        steps:
            - name: Download report
              run: gh run download ${{ github.event.workflow_run.id }} --repo ${{ github.repository }} --name benchmark-report --dir report

            - name: Post or update comment
              run: |
                  pr=$(tr -d '[:space:]' < report/pr-number)
                  if ! [[ "$pr" =~ ^[0-9]+$ ]]; then echo "bad PR number"; exit 1; fi
                  existing=$(gh api "repos/${{ github.repository }}/issues/$pr/comments" --paginate \
                      --jq '[.[] | select(.body | contains("<!-- shalom-benchmarks -->"))][0].id')
                  if [ -n "$existing" ]; then
                      gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$existing" -F body=@report/report.md
                  else
                      gh api "repos/${{ github.repository }}/issues/$pr/comments" -F body=@report/report.md
                  fi
